<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="50%" stop-color="#0c0b09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc" />
      <stop offset="25%" stop-color="#dfb75c" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#8a6616" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#d4af37" flood-opacity="0.25" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 10px rgba(212,175,55,0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 25px rgba(212,175,55,0.85)); }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particleFloat {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
        50% { transform: translateY(-40px) scale(1.2); opacity: 0.8; }
        100% { transform: translateY(-80px) scale(0.8); opacity: 0; }
      }
      .pulsing-aura { animation: pulseGlow 4s ease-in-out infinite; }
      .animated-border { stroke-dasharray: 600; animation: shimmerLine 12s linear infinite; }
      .p1 { animation: particleFloat 4s ease-in-out infinite; }
      .p2 { animation: particleFloat 5s 1s ease-in-out infinite; }
      .p3 { animation: particleFloat 6s 2s ease-in-out infinite; }
      .p4 { animation: particleFloat 4.5s 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Tech Grid Background -->
  <g opacity="0.08" stroke="#d4af37" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Floating Particles / Embers -->
  <circle cx="240" cy="300" r="2.5" fill="#f3e5ab" class="p1" />
  <circle cx="480" cy="320" r="3" fill="#dfb75c" class="p2" />
  <circle cx="720" cy="310" r="2" fill="#fff" class="p3" />
  <circle cx="960" cy="330" r="3.5" fill="#f3e5ab" class="p4" />

  <!-- Neon Border Highlight with Glow -->
  <rect x="10" y="10" width="1180" height="400" rx="14" fill="none" stroke="#2a251b" stroke-width="2" />
  <rect x="10" y="10" width="1180" height="400" rx="14" fill="none" stroke="url(#neonCyan)" stroke-width="1.8" class="animated-border" opacity="0.75" />

  <!-- Centered Branding Content (Locked at 600, 210) -->
  <g transform="translate(600, 210)">
    
    <!-- Isometric 3D Crown / Shears Emblem -->
    <g transform="translate(0, -95)" filter="url(#glow)">
      <!-- Outer Hexagon / Shield Plate -->
      <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#15130f" stroke="url(#gold3d)" stroke-width="2.5" />
      <!-- Shears / Razor / Crown Vectors -->
      <path d="M-14,-15 L14,15 M-14,15 L14,-15" stroke="url(#gold3d)" stroke-width="3" stroke-linecap="round" />
      <circle cx="-14" cy="-15" r="4" fill="none" stroke="url(#gold3d)" stroke-width="2" />
      <circle cx="14" cy="-15" r="4" fill="none" stroke="url(#gold3d)" stroke-width="2" />
      <path d="M-10,-28 L0,-36 L10,-28 L7,-22 L-7,-22 Z" fill="url(#gold3d)" />
    </g>

    <!-- Top Pill Badge -->
    <g transform="translate(0, -28)">
      <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#1c1811" stroke="#d4af37" stroke-width="1" />
      <circle cx="-158" cy="0" r="4" fill="#4cd137" class="pulsing-aura" />
      <text x="0" y="5" text-anchor="middle" fill="#f1d78a" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5">ENTERPRISE SALON ERP &amp; CLIENT PORTAL</text>
    </g>

    <!-- Main 3D Metallic Title -->
    <text x="0" y="42" text-anchor="middle" fill="url(#gold3d)" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="800" letter-spacing="7" filter="url(#shadow3d)">
      ELEGANCE SALON
    </text>

    <!-- Subtitle: Karachi Location & Spec -->
    <text x="0" y="78" text-anchor="middle" fill="#d8cfb4" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="5">
      MAIN TARIQ ROAD • PECHS KARACHI • HIGH-END GROOMING
    </text>

    <!-- Tech Badges Bar -->
    <g transform="translate(0, 120)">
      <!-- Pill 1: PHP 8.2 -->
      <g transform="translate(-240, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#181a20" stroke="#4f5d95" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#8892be" font-family="monospace" font-size="11" font-weight="bold">PHP 8.2</text>
      </g>

      <!-- Pill 2: MySQL InnoDB -->
      <g transform="translate(-115, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#181a20" stroke="#00758f" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#00a5c4" font-family="monospace" font-size="11" font-weight="bold">MySQL InnoDB</text>
      </g>

      <!-- Pill 3: 6-Chair Floor Grid -->
      <g transform="translate(20, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#181a20" stroke="#d4af37" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#f1d78a" font-family="monospace" font-size="11" font-weight="bold">6-Chair Live Floor</text>
      </g>

      <!-- Pill 4: Thermal POS -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#181a20" stroke="#2ed573" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#2ed573" font-family="monospace" font-size="11" font-weight="bold">80mm POS Print</text>
      </g>

      <!-- Pill 5: WhatsApp API -->
      <g transform="translate(295, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#181a20" stroke="#25D366" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#25D366" font-family="monospace" font-size="11" font-weight="bold">WhatsApp API</text>
      </g>
    </g>
  </g>
</svg>
